<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Z-HORROR Loading</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;}
    #bg{position:fixed;inset:0;background-image:url('https://raw.githubusercontent.com/idelit81-ship-it/load-menu-horror/main/image%20%2855%29.webp');background-size:cover;background-position:center center;background-repeat:no-repeat;background-color:#000;}
    #overlay{position:fixed;inset:0;background:radial-gradient(circle at center, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.22) 60%, rgba(0,0,0,0.52) 100%);pointer-events:none;}
    #grain{position:fixed;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(to bottom, rgba(255,255,255,.04) 0, rgba(255,255,255,.04) 1px, transparent 3px, transparent 6px);mix-blend-mode:screen;}
    #title{position:fixed;left:50%;bottom:5.5%;transform:translateX(-50%);color:#e5e5e5;font-size:15px;letter-spacing:4px;text-transform:uppercase;text-shadow:0 0 10px rgba(0,0,0,.75);opacity:.9;}
    #subtitle{position:fixed;left:50%;bottom:3.2%;transform:translateX(-50%);color:#9a9a9a;font-size:11px;letter-spacing:2px;opacity:.72;}
    #audioHint{position:fixed;left:12px;top:12px;color:#999;font-size:12px;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:6px;display:none}
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="overlay"></div>
  <div id="grain"></div>
  <div id="title">Загрузка...</div>
  <div id="subtitle">Z-HORROR</div>
  <div id="audioHint">Если музыка не стартовала — кликни один раз</div>

  <audio id="music" preload="auto" autoplay>
    <source src="https://raw.githubusercontent.com/idelit81-ship-it/load-menu-horror/main/1001%20%282%29%20%28online-audio-converter.com%29%20%281%29.mp3" type="audio/mpeg">
  </audio>

  <script>
    const music = document.getElementById('music');
    const hint = document.getElementById('audioHint');
    music.loop = false;
    music.volume = 0.9;

    function playOnce(){
      const p = music.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => {
          hint.style.display = 'block';
        });
      }
    }

    playOnce();
    document.addEventListener('click', function once(){ playOnce(); hint.style.display='none'; document.removeEventListener('click', once); }, {passive:true});
    document.addEventListener('keydown', function once(){ playOnce(); hint.style.display='none'; document.removeEventListener('keydown', once); });
  </script>
</body>
</html>
